name: Branddu
description: >-
  Branddu (Branddu Colombia / Branddu AI) is a B2B MerchTech platform that digitizes
  corporate merchandising and promotional-product procurement across Latin America.
  Operating in Colombia and Mexico, it centralizes the full purchasing workflow -
  product discovery, inventory, quotations, customization, online design, and checkout -
  through a single online catalog of more than 15,000 fully customizable products across
  46+ categories. Branddu AI (formed via a merger with Reno) combines AI, proprietary
  software, and a regional supplier network to simplify how companies source branded
  merchandise. The public storefront runs on Shopify. The company is backed by a US$300K
  pre-seed from 500 Global, bringing total capital raised to roughly US$800K.
